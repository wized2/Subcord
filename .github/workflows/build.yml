name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Optional release note override'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode and validate release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e
          IS_FORK=false
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK=true
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "Fork PR — debug signing only"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${RELEASE_STORE_PASSWORD:-}" ] \
             || [ -z "${RELEASE_KEY_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "Signing secrets incomplete — debug signing for release task"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.jks" \
              -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore invalid or password/alias mismatch — falling back to debug signing"
            rm -f "$GITHUB_WORKSPACE/release.jks"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
          fi
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: subcord-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "${{ github.event.inputs.release_note }}" ]; then
            printf '%s\n' "${{ github.event.inputs.release_note }}" > /tmp/notes.md
          elif [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md /tmp/notes.md
          else
            echo "Subcord release ${GITHUB_REF_NAME}" > /tmp/notes.md
          fi

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          body_path: /tmp/notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
